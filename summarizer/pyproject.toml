[project]
name = "summarizer"
version = "0.1.0"
description = "Grounded hierarchical summarization for VLearn transcripts (M2)"
readme = "README.md"
authors = [
    { name = "Hoang Anh Quan", email = "hanhquan027.ndt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "neo4j>=6.2.0",
    "openai>=2.50.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "vector-db",
]

[project.scripts]
summarizer-build = "summarizer.build:main"

[tool.uv.sources]
vector-db = { path = "../vector-db", editable = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "streamlit>=1.60.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "live: hits the OpenAI API; requires OPENAI_API_KEY",
]

[tool.ruff]
line-length = 100
