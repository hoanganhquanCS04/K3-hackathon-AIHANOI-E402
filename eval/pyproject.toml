[project]
name = "m3-eval"
version = "0.1.0"
description = "Reproducible evidence mining and evaluation harness for the VLearn recap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "summarizer",
]

[tool.uv.sources]
summarizer = { path = "../summarizer", editable = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

